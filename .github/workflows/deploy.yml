name: Deploy

# PR deploys use pull_request_target so the workflow that reaches the self-hosted runner is
# always the base branch's copy. PRs from this repository deploy automatically. PRs from forks
# deploy only while they carry the "deploy" label, and each of those deploys waits for approval
# on the review-external environment.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA of the source repository (ignored when pr is set)
        required: false
        default: main
      pr:
        description: Pull request number in the source repository
        required: false
      name:
        description: Slot name override, becomes <name>.tirtest.com
        required: false
      repository:
        description: Source repository
        required: true
        default: mitre/tir
  pull_request_target:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read
  packages: write
  pull-requests: write

concurrency:
  group: slot-${{ github.event.pull_request.number || inputs.name || inputs.pr || inputs.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.r.outputs.proceed }}
      repository: ${{ steps.r.outputs.repository }}
      ref: ${{ steps.r.outputs.ref }}
      slot: ${{ steps.r.outputs.slot }}
      environment: ${{ steps.r.outputs.environment }}
      pr: ${{ steps.r.outputs.pr }}
    steps:
      - uses: actions/checkout@v4

      - id: r
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          IN_REF: ${{ inputs.ref }}
          IN_PR: ${{ inputs.pr }}
          IN_NAME: ${{ inputs.name }}
          IN_REPO: ${{ inputs.repository }}
        run: |
          proceed=true
          environment=review
          if [ "$EVENT_NAME" = pull_request_target ]; then
            repository=$HEAD_REPO
            ref=$HEAD_SHA
            slot="pr-$PR_NUMBER"
            pr=$PR_NUMBER
            # Authors with write access to this repository deploy automatically, wherever
            # their branch lives. Everyone else needs the deploy label and an approval.
            permission=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$PR_AUTHOR/permission" --jq .permission 2>/dev/null || echo none)
            echo "author=$PR_AUTHOR permission=$permission"
            case "$permission" in
              admin|write) ;;
              *)
                environment=review-external
                jq -e '.pull_request.labels | map(.name) | index("deploy")' "$GITHUB_EVENT_PATH" > /dev/null || proceed=false
                ;;
            esac
          else
            repository=$IN_REPO
            ref=$IN_REF
            if [ -n "$IN_PR" ]; then ref="refs/pull/$IN_PR/head"; fi
            slot=$(deploy/slot-name.sh "$ref" "$IN_PR" "$IN_NAME")
            pr=""
          fi
          {
            echo "proceed=$proceed"
            echo "repository=$repository"
            echo "ref=$ref"
            echo "slot=$slot"
            echo "environment=$environment"
            echo "pr=$pr"
          } >> "$GITHUB_OUTPUT"
          echo "slot=$slot repository=$repository ref=$ref environment=$environment proceed=$proceed"

  build:
    needs: resolve
    if: needs.resolve.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.tags.outputs.image }}@${{ steps.build.outputs.digest }}
    steps:
      - name: Check out deploy files
        uses: actions/checkout@v4
        with:
          path: ops

      - name: Check out source
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.resolve.outputs.repository }}
          ref: ${{ needs.resolve.outputs.ref }}
          path: src

      - name: Resolve image tags
        id: tags
        env:
          OWNER: ${{ github.repository_owner }}
          SLOT: ${{ needs.resolve.outputs.slot }}
        run: |
          sha=$(git -C src rev-parse HEAD)
          short=${sha:0:12}
          repo="ghcr.io/$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')/tir"
          echo "image=$repo:sha-$short" >> "$GITHUB_OUTPUT"
          echo "tags=$repo:sha-$short,$repo:$SLOT" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: src
          file: ops/deploy/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ needs.resolve.outputs.repository }}
            org.opencontainers.image.revision=${{ steps.tags.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

  deploy:
    needs: [resolve, build]
    runs-on: tir-deploy
    environment:
      name: ${{ needs.resolve.outputs.environment }}
      url: https://${{ needs.resolve.outputs.slot }}.tirtest.com
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-kubectl@v4

      - name: Apply slot and roll out
        env:
          SLOT: ${{ needs.resolve.outputs.slot }}
          IMAGE: ${{ needs.build.outputs.image }}
          SOURCE: ${{ needs.resolve.outputs.repository }}@${{ needs.resolve.outputs.ref }}
        run: |
          deploy/render.sh "$SLOT" "$IMAGE" "$SOURCE" | kubectl apply -f -
          kubectl -n tir wait database "tir-$SLOT" --for=jsonpath='{.status.applied}'=true --timeout=2m
          kubectl -n tir rollout status "deployment/tir-$SLOT" --timeout=15m

      - name: Comment on the pull request
        if: needs.resolve.outputs.pr != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ needs.resolve.outputs.pr }}
          SLOT: ${{ needs.resolve.outputs.slot }}
          REF: ${{ needs.resolve.outputs.ref }}
        run: |
          body="Deployed ${REF:0:12} to https://$SLOT.tirtest.com"
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            -d "$(jq -n --arg body "$body" '{body: $body}')" > /dev/null

      - name: Summary
        env:
          SOURCE: ${{ needs.resolve.outputs.repository }}@${{ needs.resolve.outputs.ref }}
          SLOT: ${{ needs.resolve.outputs.slot }}
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          {
            echo "Deployed **$SOURCE** to https://$SLOT.tirtest.com"
            echo
            echo "Image: \`$IMAGE\`"
          } >> "$GITHUB_STEP_SUMMARY"
